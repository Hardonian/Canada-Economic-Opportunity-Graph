name: canada-opportunity-graph

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      PORT: 8080
      ENV: production
      STORAGE_MODE: ${STORAGE_MODE:-persistent}
      STORAGE_DIR: /app/data/store
      INGEST_INTERVAL: ${INGEST_INTERVAL:-5m}
      GLOBAL_TRADE_MODE: ${GLOBAL_TRADE_MODE:-snapshot}
      BANKOFCANADA_LIVE: ${BANKOFCANADA_LIVE:-0}
      FEDERAL_CONTRACTS_LIVE: ${FEDERAL_CONTRACTS_LIVE:-0}
      LOBBYIST_REGISTRY_LIVE: ${LOBBYIST_REGISTRY_LIVE:-0}
      CMHC_HOUSING_LIVE: ${CMHC_HOUSING_LIVE:-0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    volumes:
      - cog-data:/app/data/store
    networks: [app]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    restart: unless-stopped
    environment:
      COG_API_BASE: http://api:8080/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 8s
      retries: 3
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    networks: [app]

networks:
  app:
    internal: true

volumes:
  cog-data:
