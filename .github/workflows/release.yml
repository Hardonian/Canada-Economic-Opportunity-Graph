name: release-pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write # Required for Cosign keyless signing

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API container image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ceo-g-api:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push web container image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-runner
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ceo-g-web:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

      - name: Generate CycloneDX SBOM for API
        uses: CycloneDX/gh-gomod-generate-sbom@v2
        with:
          version: v1
          args: -licenses -json -output api-sbom.json

      - name: Sign container image with Cosign
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/ceo-g-api@${{ steps.build-api.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/ceo-g-web@${{ steps.build-web.outputs.digest }}

      - name: Publish immutable image references
        run: |
          printf '{"api":"ghcr.io/%s/ceo-g-api@%s","web":"ghcr.io/%s/ceo-g-web@%s"}\n' \
            '${{ github.repository_owner }}' '${{ steps.build-api.outputs.digest }}' \
            '${{ github.repository_owner }}' '${{ steps.build-web.outputs.digest }}' > image-digests.json

      - name: Upload signed image references
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
