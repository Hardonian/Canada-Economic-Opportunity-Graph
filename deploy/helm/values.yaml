# Default values for canada-economic-opportunity-graph Helm Chart.

profile: cluster # Options: standalone, cluster, airgap-scif

global:
  environment: production
  domain: opportunity.canada.ca
  imageRegistry: ghcr.io/hardonian
  imagePullPolicy: IfNotPresent

api:
  enabled: true
  # Persistent WAL storage is single-writer. Use the snapshot profile for
  # horizontal API scaling until a replicated transactional store is adopted.
  replicaCount: 1
  image:
    repository: ceo-g-api
    tag: v1.0.0
  port: 8080
  storage:
    mode: persistent # persistent or snapshot
    dir: /app/data/store
    size: 100Gi
    storageClassName: premium-rwo
  ingestion:
    interval: 5m # set to "0" for immutable snapshot-only serving
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 4Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75

web:
  enabled: true
  replicaCount: 3
  image:
    repository: ceo-g-web
    tag: v1.0.0
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    web: opportunity.canada.ca
    api: api.opportunity.canada.ca
  tls:
    enabled: true
    secretName: cog-tls-certificate

networkPolicy:
  enabled: true
  airgap: false # When true, blocks all egress except intra-cluster and internal DNS

telemetry:
  prometheus:
    enabled: true
    scrape: true
    path: /metrics
    port: 8080
