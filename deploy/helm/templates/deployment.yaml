{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canada-economic-opportunity-graph.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    {{- if eq .Values.api.storage.mode "persistent" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.api.port }}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.api.port }}"
            - name: ENV
              value: "{{ .Values.global.environment }}"
            - name: STORAGE_MODE
              value: "{{ .Values.api.storage.mode }}"
            - name: STORAGE_DIR
              value: "{{ .Values.api.storage.dir }}"
            - name: INGEST_INTERVAL
              value: "{{ .Values.api.ingestion.interval }}"
            - name: CORS_ORIGINS
              value: "https://{{ .Values.ingress.hosts.web }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.api.storage.mode "persistent" }}
            - name: data
              mountPath: {{ .Values.api.storage.dir }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if eq .Values.api.storage.mode "persistent" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "canada-economic-opportunity-graph.fullname" . }}-wal-data
        {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
{{- end }}
{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canada-economic-opportunity-graph.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: web
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.web.port }}"
            - name: NODE_ENV
              value: "production"
            - name: COG_API_BASE
              value: {{ printf "http://%s-api:%v/api/v1" (include "canada-economic-opportunity-graph.fullname" .) .Values.api.port | quote }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
{{- end }}
