apiVersion: v1
kind: Service
metadata:
  name: {{ include "canada-economic-opportunity-graph.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "canada-economic-opportunity-graph.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "canada-economic-opportunity-graph.name" . }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
