apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cog-api-hpa
  namespace: cog-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cog-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cog-web-hpa
  namespace: cog-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cog-web
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
