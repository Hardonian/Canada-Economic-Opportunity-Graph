apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cog-web-pdb
  namespace: cog-system
  labels:
    app.kubernetes.io/name: canada-economic-opportunity-graph
    app.kubernetes.io/component: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: canada-economic-opportunity-graph
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cog-api-pdb
  namespace: cog-system
  labels:
    app.kubernetes.io/name: canada-economic-opportunity-graph
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: canada-economic-opportunity-graph
      app.kubernetes.io/component: api
